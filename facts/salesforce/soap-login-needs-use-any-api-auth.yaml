id: af:salesforce:soap-login-needs-use-any-api-auth
service: salesforce
kind: auth_quirk
target:
  surface: http
  method: POST
  path_template: "/services/Soap/u/{version}"
signal:
  error_code: INSUFFICIENT_ACCESS
claim: "Where login() is restricted (the default in new orgs), a user without the Use Any API Auth permission gets INSUFFICIENT_ACCESS from login()."
dimensions:
