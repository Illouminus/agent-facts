id: af:anthropic:missing-api-key-before-model-lookup
service: anthropic
kind: auth_quirk
target:
  surface: http
  method: GET
  path_template: "/v1/models/{model_id}"
signal:
  status: 401
  error_code: authentication_error
  error_string: "x-api-key header is required"
  normalized: "x-api-key header is required"
claim: "GET /v1/models/{model_id} without an x-api-key returns HTTP 401 \"x-api-key header is required\" even for a model id that does not exist: the key is checked before the model, so the 401 says nothing about the id."
dimensions:
  env: prod
  account_state: anonymous
fixes:
  - {action: set_header, name: x-api-key, value_source: account_setting:api_key}
status: verified:server:prod
evidence:
