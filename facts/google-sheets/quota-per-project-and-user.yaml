id: af:google-sheets:quota-per-project-and-user
service: google-sheets
kind: rate_limit
target:
  surface: http
  method: GET
  path_template: "/v4/spreadsheets/{spreadsheet_id}/values/{range}"
signal:
  status: 429
claim: "Read and write requests are each limited to 300 per minute per project and 60 per minute per user per project, refilled every minute; going over returns HTTP 429."
dimensions:
  env: prod
  account_state: any
fixes:
  - {action: backoff_exponential, base_ms: 1000, factor: 2, max_ms: 64000, max_attempts: 5, jitter: true}
status: official
evidence:
  first_seen: 2026-10-24T08:00:00Z
  official_url: https://developers.google.com/workspace/sheets/api/limits
provenance:
  source: manual
  author: bot
  created: 2026-10-24
  history: [{date: 2026-10-24, change: created, by: bot}]
