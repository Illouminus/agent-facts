id: af:github:private-repo-404-not-403
service: github
kind: auth_quirk
target:
  surface: http
  method: GET
  path_template: "/repos/{owner}/{repo}"
signal:
  status: 404
  error_string: "Not Found"
  normalized: "not found"
claim: "A request for a private resource without proper authentication returns 404 Not Found, not 403 Forbidden, so that the existence of private repositories is not confirmed."
dimensions:
