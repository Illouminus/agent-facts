id: af:github:anonymous-cache-ignores-api-version
service: github
kind: silent_behavior
target:
  surface: http
  method: GET
  path_template: "/repos/{owner}/{repo}"
signal:
  status: 200
claim: "Anonymous GET /repos/{owner}/{repo} responses are publicly cached for 60 s and Vary omits X-GitHub-Api-Version, so a request can get a cached body of another API version; X-GitHub-Api-Version-Selected names the one served."
dimensions:
  env: prod
  account_state: anonymous
