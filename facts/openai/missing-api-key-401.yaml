id: af:openai:missing-api-key-401
service: openai
kind: auth_quirk
target:
  surface: http
  method: GET
  path_template: "/v1/models"
signal:
  status: 401
  error_code: invalid_request_error
  error_string: "Missing bearer authentication in header"
  normalized: "missing bearer authentication in header"
claim: "A request without an Authorization header returns HTTP 401 \"Missing bearer authentication in header\" with error.type invalid_request_error and error.code null (an invalid key has code invalid_api_key), plus WWW-Authenticate: Bearer realm=\"OpenAI API\"."
dimensions:
  env: prod
  account_state: anonymous
fixes:
  - {action: set_header, name: Authorization, value_source: account_setting:bearer_api_key}
status: verified:server:prod
evidence:
  probe: af:openai:probe:no-key
