id: af:openai:missing-api-key-before-model-lookup
service: openai
kind: auth_quirk
target:
  surface: http
  method: GET
  path_template: "/v1/models/{model}"
signal:
  status: 401
  error_code: invalid_request_error
  error_string: "Missing bearer authentication in header"
  normalized: "missing bearer authentication in header"
claim: "GET /v1/models/{model} without an Authorization header returns HTTP 401 \"Missing bearer authentication in header\" even for a model id that does not exist: the key is checked before the model, so the 401 says nothing about the id."
dimensions:
  env: prod
  account_state: anonymous
fixes:
  - {action: set_header, name: Authorization, value_source: account_setting:bearer_api_key}
status: verified:server:prod
evidence:
  probe: af:openai:probe:no-key
  first_seen: 2026-10-31T13:45:07Z
  last_confirmed: 2026-10-31T13:45:07Z
  confirmations: 1
  stale_counter: 0
  vantages: [mac-dev]
provenance:
  source: probe
  author: bot
  created: 2026-10-31
  history: [{date: 2026-10-31, change: created, by: bot}, {date: 2026-10-31, change: verified, by: bot, previous_status: reported}]
