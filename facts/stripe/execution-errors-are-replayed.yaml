id: af:stripe:execution-errors-are-replayed
service: stripe
kind: silent_behavior
target:
  surface: http
  method: POST
  path_template: /v1/payment_intents
signal:
  status: 400
  error_code: amount_too_small
  error_string: "Amount must convert to at least 50 cents. $0.10 converts to approximately €0.09."
  normalized: "amount must convert to at least ## cents. $#.## converts to approximately €#.##."
claim: "A 400 returned after the endpoint began executing, such as amount_too_small, is saved under its Idempotency-Key: a retry with the same key returns the same error with Idempotent-Replayed: true."
dimensions:
  env: sandbox
  account_state: any
fixes:
  - {action: set_header, name: Idempotency-Key, value_source: new_uuid_per_distinct_request}
