id: af:stripe:idempotency-key-reuse-different-params
service: stripe
kind: error_meaning
target:
  surface: http
  method: POST
  path_template: /v1/payment_intents
signal:
  status: 400
  error_code: idempotency_error
  error_string: "Keys for idempotent requests can only be used with the same parameters they were first used with. Try using a key other than '3f1e9c2a-7b4d-4e8f-9a6c-1d2b3c4d5e6f' if you meant to execute a different request."
  normalized: "keys for idempotent requests can only be used with the same parameters they were first used with. try using a key other than '<id>' if you meant to execute a different request."
claim: "Reusing an Idempotency-Key with a different request body returns HTTP 400 with error type idempotency_error; the second request is not performed."
