id: af:linear:invalid-api-key-same-as-missing
service: linear
kind: auth_quirk
target:
  surface: http
  method: GET
  path_template: "/graphql"
signal:
  status: 401
  error_code: AUTHENTICATION_ERROR
  error_string: "Authentication required, not authenticated"
  normalized: "authentication required, not authenticated"
claim: "An Authorization value that is not a valid key returns exactly what no key returns: HTTP 401 AUTHENTICATION_ERROR \"Authentication required, not authenticated\". Linear has no separate invalid-key error, so this 401 does not tell a wrong key from a missing one."
dimensions:
  env: prod
  account_state: anonymous
fixes:
  - {action: set_header, name: Authorization, value_source: account_setting:api_key}
status: verified:server:prod
evidence:
