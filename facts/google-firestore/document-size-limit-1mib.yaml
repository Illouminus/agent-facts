id: af:google-firestore:document-size-limit-1mib
service: google-firestore
kind: rate_limit
target:
  surface: http
  method: PATCH
  path_template: "/v1/projects/{project}/databases/{database}/documents/{collection}/{document}"
claim: "A document is at most 1 MiB (1,048,576 bytes), an API request at most 10 MiB, and subcollections nest at most 100 levels deep."
dimensions:
  env: prod
  account_state: any
fixes:
  - {action: reduce_payload, field: fields, max_bytes: 1048576}
status: official
evidence:
  first_seen: 2026-10-24T08:00:00Z
  official_url: https://firebase.google.com/docs/firestore/quotas
provenance:
  source: manual
  author: bot
  created: 2026-10-24
  history: [{date: 2026-10-24, change: created, by: bot}]
