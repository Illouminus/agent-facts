[project]
name = "apifacts-pytest"
dynamic = ["version"]
description = "pytest plugin: a test failing on an HTTP error prints the known facts from the apifacts registry."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "apifacts>=0.1.0",
    "pytest>=8.0",
]
classifiers = ["Framework :: Pytest"]

[project.urls]
Repository = "https://github.com/Illouminus/apifacts"

[project.entry-points.pytest11]
apifacts = "apifacts_pytest.plugin"  # name used by `-p apifacts` / `-p no:apifacts`

[dependency-groups]
dev = [
    "pytest-httpserver>=1.2.0",
    "requests>=2.32.0",
]

[tool.uv.sources]
apifacts = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "apifacts_pytest/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["apifacts_pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "pytester", "-p", "no:apifacts"]  # inner pytester runs load it from the entry point

[tool.ruff]
extend = "../../pyproject.toml"
src = [".", "tests"]  # apifacts_pytest is first-party here; apifacts is a dependency
