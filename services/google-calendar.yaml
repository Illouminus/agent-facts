# Google Calendar API v3 (wave 1 seed, keyed): the GCP project's API key (google-api-key, a google
# family key) on Edouard's public test calendar, shared publicly as free/busy only. Probes are
# read-only GETs. Errors use the legacy envelope (error.code number, error.message,
# error.errors[].reason) and rarely error.status.
key: google-calendar
name: Google Calendar API
hosts: [www.googleapis.com]
doc_hosts: [developers.google.com]
surfaces:
  http:
    base_url: https://www.googleapis.com
    templates:
      - {method: GET, path: "/calendar/v3/calendars/{calendar_id}"}
      - {method: GET, path: "/calendar/v3/calendars/{calendar_id}/events"}
      - {method: GET, path: "/calendar/v3/calendars/{calendar_id}/events/{event_id}"}
      - {method: GET, path: /calendar/v3/users/me/calendarList}
      - {method: POST, path: /calendar/v3/freeBusy}
    signal_fields:  # error.code is the HTTP status as a number; status is rare here
      - status
      - error.status
      - error.message
      - retry-after
  sdk:
    - {ecosystem: pypi, package: google-api-python-client}
    - {ecosystem: npm, package: googleapis}
dimensions:
  env: {prod: https://www.googleapis.com}
  account_state: [api_key, oauth]
auth: {kind: query, key_name: google-api-key, env: prod, param_name: key}
tos:
  automated_access: allowed
  publish_measurements: allowed
  source: https://developers.google.com/terms
probe_budget: {per_template_seconds: 300}
