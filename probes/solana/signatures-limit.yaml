id: af:solana:probe:signatures-limit
service: solana
env: prod
account_state: anonymous
steps:
  - {do: http, method: POST, path: /, json: {jsonrpc: "2.0", id: 1, method: getSignaturesForAddress, params: [Vote111111111111111111111111111111111111111, {limit: 1001}]}}
assert:
  - {step: 1, status: 200}
  - {step: 1, json_path: $.error.code, equals: -32602}
  - {step: 1, json_path: $.error.message, equals: "Invalid limit; max 1000"}
