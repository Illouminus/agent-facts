id: af:solana:probe:invalid-pubkey
service: solana
env: prod
account_state: anonymous
steps:
  - {do: http, method: POST, path: /, json: {jsonrpc: "2.0", id: 1, method: getBalance, params: [notapubkey]}}
assert:
  - {step: 1, status: 200}
  - {step: 1, json_path: $.error.code, equals: -32602}
  - {step: 1, json_path: $.error.message, equals: "Invalid param: WrongSize"}
