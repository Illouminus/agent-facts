# A Developer Edition org: 15,000 API requests a day, echoed in Sforce-Limit-Info on /limits and
# on a query.
id: af:salesforce:probe:daily-api-limit
service: salesforce
env: sandbox
account_state: developer_edition
steps:
  - {do: http, method: GET, path: /services/data/v62.0/limits}
  - {do: http, method: GET, path: /services/data/v62.0/query, query: {q: "SELECT Id FROM Account WHERE Name = 'agent-facts-no-such-account'"}}
assert:
  - {step: 1, status: 200}
  - {step: 1, json_path: $.DailyApiRequests.Max, equals: 15000}
  - {step: 1, json_path: $.DailyApiRequests.Remaining, exists: true}
  - {step: 1, header: Sforce-Limit-Info, matches: "^api-usage=[0-9]+/15000$"}
  - {step: 2, header: Sforce-Limit-Info, matches: "^api-usage=[0-9]+/15000$"}
