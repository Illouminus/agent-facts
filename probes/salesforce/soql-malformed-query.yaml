id: af:salesforce:probe:soql-malformed-query
service: salesforce
env: sandbox
account_state: developer_edition
steps:
  - {do: http, method: GET, path: /services/data/v62.0/query, query: {q: "SELEC Id FROM Account"}}
assert:
  - {step: 1, status: 400}
  - {step: 1, json_path: "$[0].errorCode", equals: MALFORMED_QUERY}
  - {step: 1, json_path: "$[0].message", equals: "unexpected token: 'SELEC'"}
