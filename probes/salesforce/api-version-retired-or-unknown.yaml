# v30.0 is a retired API version (410 Gone); v99.0 does not exist yet (404).
id: af:salesforce:probe:api-version-retired-or-unknown
service: salesforce
env: sandbox
account_state: developer_edition
steps:
  - {do: http, method: GET, path: /services/data/v30.0/limits}
  - {do: http, method: GET, path: /services/data/v99.0/limits}
assert:
  - {step: 1, status: 410}
  - {step: 1, json_path: "$[0].message", equals: The requested resource no longer exists.}
  - {step: 2, status: 404}
  - {step: 2, json_path: "$[0].message", equals: The requested resource does not exist}
