# The google.rpc error envelope only (numeric code, status name, typed details), not the message.
id: af:google-gemini:probe:error-envelope
service: google-gemini
env: prod
steps:
  - {do: http, method: GET, path: /v1beta/models, query: {agent_facts_unknown: "1"}}
assert:
  - {step: 1, status: 400}
  - {step: 1, json_path: $.error.code, equals: 400}
  - {step: 1, json_path: $.error.status, equals: INVALID_ARGUMENT}
  - {step: 1, json_path: "$.error.details[0].@type", equals: type.googleapis.com/google.rpc.BadRequest}
