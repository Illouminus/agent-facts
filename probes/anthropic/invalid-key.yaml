# The runner's fake constant in x-api-key (`auth: invalid`, not key-shaped): 401 "invalid x-api-key".
id: af:anthropic:probe:invalid-key
service: anthropic
env: prod
account_state: anonymous
steps:
  - {do: http, method: GET, path: /v1/models, auth: invalid}
  - {do: http, method: GET, path: /v1/models/claude-agent-facts-no-such-model, auth: invalid}
assert:
  - {step: 1, status: 401}
  - {step: 1, json_path: $.error.type, equals: authentication_error}
  - {step: 1, json_path: $.error.message, equals: invalid x-api-key}
  - {step: 1, header: x-should-retry, equals: "false"}
  - {step: 2, status: 401}
  - {step: 2, json_path: $.error.message, equals: invalid x-api-key}
