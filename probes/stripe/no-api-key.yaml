# Keyless step: what an agent gets when its Authorization header is missing.
id: af:stripe:probe:no-api-key
service: stripe
env: sandbox
steps:
  - {do: http, method: GET, path: /v1/customers, auth: none}
assert:
  - {step: 1, status: 401}
  - {step: 1, json_path: $.error.type, equals: invalid_request_error}
  - {step: 1, json_path: $.error.code, exists: false}
  - {step: 1, json_path: $.error.message, contains: "You did not provide an API key."}
