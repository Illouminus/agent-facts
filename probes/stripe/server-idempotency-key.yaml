# A POST sent without Idempotency-Key comes back with one the server chose (a UUID); a GET does not.
id: af:stripe:probe:server-idempotency-key
service: stripe
env: sandbox
steps:
  - {do: http, method: POST, path: /v1/customers, form: {description: agent-facts probe}}
  - {do: http, method: GET, path: /v1/customers, query: {limit: 1}}
assert:
  - {step: 1, status: 200}
  - {step: 1, header: Idempotency-Key, matches: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}
  - {step: 2, status: 200}
  - {step: 2, header: Idempotency-Key, present: false}
