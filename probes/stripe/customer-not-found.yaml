id: af:stripe:probe:customer-not-found
service: stripe
env: sandbox
steps:
  - {do: http, method: GET, path: /v1/customers/cus_agentfactsnosuch}
assert:
  - {step: 1, status: 404}
  - {step: 1, json_path: $.error.type, equals: invalid_request_error}
  - {step: 1, json_path: $.error.code, equals: resource_missing}
  - {step: 1, json_path: $.error.param, equals: id}
  - {step: 1, json_path: $.error.message, equals: "No such customer: 'cus_agentfactsnosuch'"}
