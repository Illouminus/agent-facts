# A list cursor naming an object that does not exist.
id: af:stripe:probe:starting-after-missing
service: stripe
env: sandbox
steps:
  - {do: http, method: GET, path: /v1/customers, query: {starting_after: cus_agentfactsnosuch}}
assert:
  - {step: 1, status: 400}
  - {step: 1, json_path: $.error.code, equals: resource_missing}
  - {step: 1, json_path: $.error.param, equals: starting_after}
  - {step: 1, json_path: $.error.message, equals: "No such customer: 'cus_agentfactsnosuch'"}
