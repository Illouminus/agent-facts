# limit=0 (documented range 1-100) is not refused: one object comes back and has_more is true.
# Steps 1-2 make sure the test account holds at least two customers.
id: af:stripe:probe:limit-zero-returns-one
service: stripe
env: sandbox
steps:
  - {do: http, method: POST, path: /v1/customers, form: {description: agent-facts probe}}
  - {do: http, method: POST, path: /v1/customers, form: {description: agent-facts probe}}
  - {do: http, method: GET, path: /v1/customers, query: {limit: 0}}
assert:
  - {step: 3, status: 200}
  - {step: 3, json_path: $.object, equals: list}
  - {step: 3, json_path: "$.data[0].object", equals: customer}
  - {step: 3, json_path: "$.data[1]", exists: false}
  - {step: 3, json_path: $.has_more, equals: true}
