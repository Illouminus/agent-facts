# Test PaymentMethod pm_card_chargeDeclinedIncorrectCvc, confirmed at creation; creates a failed test PaymentIntent.
id: af:stripe:probe:card-incorrect-cvc
service: stripe
env: sandbox
steps:
  - {do: http, method: POST, path: /v1/payment_intents, form: {amount: 1000, currency: usd, payment_method: pm_card_chargeDeclinedIncorrectCvc, confirm: "true", "automatic_payment_methods[enabled]": "true", "automatic_payment_methods[allow_redirects]": never}}
assert:
  - {step: 1, status: 402}
  - {step: 1, json_path: $.error.type, equals: card_error}
  - {step: 1, json_path: $.error.code, equals: incorrect_cvc}
  - {step: 1, json_path: $.error.decline_code, equals: incorrect_cvc}
  - {step: 1, json_path: $.error.advice_code, equals: confirm_card_data}
  - {step: 1, json_path: $.error.message, equals: "Your card's security code is incorrect."}
  - {step: 1, json_path: $.error.param, equals: cvc}
