id: af:stripe:probe:expand-not-expandable
service: stripe
env: sandbox
steps:
  - {do: http, method: GET, path: /v1/customers, query: {limit: 1, "expand[0]": data.agent_facts}}
assert:
  - {step: 1, status: 400}
  - {step: 1, json_path: $.error.type, equals: invalid_request_error}
  - {step: 1, json_path: $.error.message, equals: "This property cannot be expanded (data.agent_facts)."}
