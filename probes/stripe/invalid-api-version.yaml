id: af:stripe:probe:invalid-api-version
service: stripe
env: sandbox
steps:
  - {do: http, method: GET, path: /v1/customers, query: {limit: 1}, headers: {Stripe-Version: "2099-01-01"}}
assert:
  - {step: 1, status: 400}
  - {step: 1, json_path: $.error.type, equals: invalid_request_error}
  - {step: 1, json_path: $.error.message, equals: "Invalid Stripe API version: 2099-01-01"}
