# Test PaymentMethod pm_card_chargeDeclinedInsufficientFunds, confirmed at creation; creates a failed test PaymentIntent.
id: af:stripe:probe:card-insufficient-funds
service: stripe
env: sandbox
steps:
  - {do: http, method: POST, path: /v1/payment_intents, form: {amount: 1000, currency: usd, payment_method: pm_card_chargeDeclinedInsufficientFunds, confirm: "true", "automatic_payment_methods[enabled]": "true", "automatic_payment_methods[allow_redirects]": never}}
assert:
  - {step: 1, status: 402}
  - {step: 1, json_path: $.error.type, equals: card_error}
  - {step: 1, json_path: $.error.code, equals: card_declined}
  - {step: 1, json_path: $.error.decline_code, equals: insufficient_funds}
  - {step: 1, json_path: $.error.advice_code, equals: try_again_later}
  - {step: 1, json_path: $.error.message, equals: "Your card has insufficient funds. Use a different payment method to complete this purchase."}
