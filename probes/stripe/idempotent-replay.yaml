# Same key, same body: the second answer is the saved first one, flagged by Idempotent-Replayed.
id: af:stripe:probe:idempotent-replay
service: stripe
env: sandbox
steps:
  - {do: http, method: POST, path: /v1/customers, form: {description: agent-facts probe}, headers: {Idempotency-Key: "{{run_uuid}}"}}
  - {do: http, method: POST, path: /v1/customers, form: {description: agent-facts probe}, headers: {Idempotency-Key: "{{run_uuid}}"}}
assert:
  - {step: 1, status: 200}
  - {step: 1, header: Idempotent-Replayed, present: false}
  - {step: 2, status: 200}
  - {step: 2, header: Idempotent-Replayed, equals: "true"}
  - {step: 2, json_path: $.object, equals: customer}
