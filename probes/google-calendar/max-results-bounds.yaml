# maxResults=0 is refused; 5000 (above the documented 2500 maximum) is accepted.
id: af:google-calendar:probe:max-results-bounds
service: google-calendar
env: prod
account_state: api_key
steps:
  - {do: http, method: GET, path: "/calendar/v3/calendars/916ea40bea99d99c310e2aab42492c44500629a59cd44e4f50a73d08a15b3c9a@group.calendar.google.com/events", query: {maxResults: 0}}
  - {do: http, method: GET, path: "/calendar/v3/calendars/916ea40bea99d99c310e2aab42492c44500629a59cd44e4f50a73d08a15b3c9a@group.calendar.google.com/events", query: {maxResults: 5000}}
assert:
  - {step: 1, status: 400}
  - {step: 1, json_path: $.error.message, contains: "Values must be within the range: [1,"}
  - {step: 1, json_path: "$.error.errors[0].reason", equals: invalidParameter}
  - {step: 2, status: 200}
