id: af:google-calendar:probe:invalid-page-token
service: google-calendar
env: prod
account_state: api_key
steps:
  - {do: http, method: GET, path: "/calendar/v3/calendars/916ea40bea99d99c310e2aab42492c44500629a59cd44e4f50a73d08a15b3c9a@group.calendar.google.com/events", query: {pageToken: apifacts}}
assert:
  - {step: 1, status: 400}
  - {step: 1, json_path: $.error.message, equals: Invalid page token value.}
