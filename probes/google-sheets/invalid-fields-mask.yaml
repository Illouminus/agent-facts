# A field mask naming a field that does not exist: a generic message, no field named.
id: af:google-sheets:probe:invalid-fields-mask
service: google-sheets
env: prod
account_state: api_key
steps:
  - {do: http, method: GET, path: "/v4/spreadsheets/1KQGUVQhCtk9f6Cy8vnTefNWJw_eKvtowwjA3vL0qR7I", query: {fields: agentfacts}}
assert:
  - {step: 1, status: 400}
  - {step: 1, json_path: $.error.message, equals: Request contains an invalid argument.}
