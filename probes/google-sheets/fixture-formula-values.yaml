# FORMULA: formulas as text in the spreadsheet locale's syntax (; separates arguments on fr_FR).
id: af:google-sheets:probe:fixture-formula-values
service: google-sheets
env: prod
account_state: api_key
steps:
  - {do: http, method: GET, path: "/v4/spreadsheets/1KQGUVQhCtk9f6Cy8vnTefNWJw_eKvtowwjA3vL0qR7I/values/A1:E5", query: {valueRenderOption: FORMULA}}
assert:
  - {step: 1, status: 200}
  - {step: 1, json_path: "$.values[1][2]", equals: "=B2*2"}
  - {step: 1, json_path: "$.values[1][3]", equals: "=DATE(2026;10;24)"}
  - {step: 1, json_path: "$.values[1][1]", equals: 3.14159}
  - {step: 1, json_path: "$.values[1][4]", equals: true}
