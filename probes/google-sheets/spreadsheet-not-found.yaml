id: af:google-sheets:probe:spreadsheet-not-found
service: google-sheets
env: prod
account_state: api_key
steps:
  - {do: http, method: GET, path: /v4/spreadsheets/1AgentFactsNoSuchSpreadsheetIdAgentFactsXyz00/values/A1}
assert:
  - {step: 1, status: 404}
  - {step: 1, json_path: $.error.status, equals: NOT_FOUND}
  - {step: 1, json_path: $.error.message, equals: Requested entity was not found.}
