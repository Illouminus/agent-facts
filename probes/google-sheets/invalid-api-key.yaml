id: af:google-sheets:probe:invalid-api-key
service: google-sheets
env: prod
steps:
  - {do: http, method: GET, path: "/v4/spreadsheets/1KQGUVQhCtk9f6Cy8vnTefNWJw_eKvtowwjA3vL0qR7I/values/A1", auth: none, query: {key: agent-facts-invalid-key}}
assert:
  - {step: 1, status: 400}
  - {step: 1, json_path: $.error.status, equals: INVALID_ARGUMENT}
  - {step: 1, json_path: "$.error.details[0].reason", equals: API_KEY_INVALID}
