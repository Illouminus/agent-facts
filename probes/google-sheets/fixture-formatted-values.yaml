# Fixture 'Feuille 1'!A1:E5 (fr_FR spreadsheet): label|number|formula|date|flag /
# pi|3.14159|=B2*2|=DATE(2026;10;24)|TRUE / short row|x / (empty row) / after empty row.
# Default render: strings formatted in the spreadsheet's locale; rows are not padded.
id: af:google-sheets:probe:fixture-formatted-values
service: google-sheets
env: prod
account_state: api_key
steps:
  - {do: http, method: GET, path: "/v4/spreadsheets/1KQGUVQhCtk9f6Cy8vnTefNWJw_eKvtowwjA3vL0qR7I/values/A1:E5"}
assert:
  - {step: 1, status: 200}
  - {step: 1, json_path: "$.values[1][1]", equals: "3,14159"}
  - {step: 1, json_path: "$.values[1][2]", equals: "6,28318"}
  - {step: 1, json_path: "$.values[1][3]", equals: "24/10/2026"}
  - {step: 1, json_path: "$.values[1][4]", equals: "TRUE"}
  - {step: 1, json_path: "$.values[2][1]", equals: x}
  - {step: 1, json_path: "$.values[2][2]", exists: false}
  - {step: 1, json_path: "$.values[3][0]", exists: false}
  - {step: 1, json_path: "$.values[4][0]", equals: after empty row}
