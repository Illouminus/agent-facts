# UNFORMATTED_VALUE: JSON numbers and booleans; a date is its serial number (days since 1899-12-30).
id: af:google-sheets:probe:fixture-unformatted-values
service: google-sheets
env: prod
account_state: api_key
steps:
  - {do: http, method: GET, path: "/v4/spreadsheets/1KQGUVQhCtk9f6Cy8vnTefNWJw_eKvtowwjA3vL0qR7I/values/A1:E5", query: {valueRenderOption: UNFORMATTED_VALUE}}
assert:
  - {step: 1, status: 200}
  - {step: 1, json_path: "$.values[1][1]", equals: 3.14159}
  - {step: 1, json_path: "$.values[1][2]", equals: 6.28318}
  - {step: 1, json_path: "$.values[1][3]", equals: 46319}
  - {step: 1, json_path: "$.values[1][4]", equals: true}
