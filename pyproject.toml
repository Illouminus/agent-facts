[project]
name = "apifacts"
dynamic = ["version"]
description = "Open registry of verified facts about machine interfaces (APIs, SDKs, CLIs) for AI agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DATA"]  # LICENSE-DATA: the packaged snapshot (facts/, services/) is CC BY 4.0
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.150.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "ruamel.yaml>=0.19.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://apifacts.dev"
Repository = "https://github.com/Illouminus/apifacts"
Issues = "https://github.com/Illouminus/apifacts/issues"

[project.scripts]
apifacts = "apifacts.cli:app"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3",
]

[dependency-groups]
dev = [
    "mcp>=2.3",
    "pytest>=9.1.1",
    "pytest-httpserver>=1.2.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "apifacts/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = ["apifacts", "schema", "services", "facts"]  # what the wheel needs; no pages/, probes/, tests/

[tool.hatch.build.targets.wheel]
packages = ["apifacts"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "apifacts/schema/json"  # load_schema() prefers this packaged copy
"services" = "apifacts/client/snapshot/services"  # offline snapshot (spec 07): the registry as of the build
"facts" = "apifacts/client/snapshot/facts"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]  # research scripts and notes are not the package

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option / fastapi.Depends in defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_pypistats: ops test that runs digest.pypi_downloads against a local fake"]
